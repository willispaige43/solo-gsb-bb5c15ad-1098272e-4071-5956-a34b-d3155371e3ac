services:
  phase-api:
    build: .
    image: phase-allocation-api:latest
    container_name: phase-allocation-api
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      # 容器内 SQLite 数据库路径；数据通过下方命名卷持久化
      DB_PATH: /data/phase_allocations.db
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: "8000"
    volumes:
      - phase-db-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  phase-db-data:
